services:
  - type: web
    name: aivycheck
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AIVY_ADMIN_PASSWORD
        sync: false
      - key: AIVY_EMPLOYEE_PASSWORD
        sync: false
